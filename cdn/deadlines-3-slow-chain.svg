<text x="846" y="206" fill="#666" font-size="11">ms</text>
<line x1="830.0" y1="50" x2="830.0" y2="190" stroke="#D62728" stroke-width="2"/>
<rect x="170.0" y="105" width="158.4" height="26" rx="3" fill="#4C78A8"/>
<text x="249.2" y="122" text-anchor="middle" fill="#fff" font-weight="600" font-size="13">A answers in 48</text>
<rect x="328.4" y="105" width="356.4" height="26" rx="3" fill="#F58518"/>
<text x="506.6" y="122" text-anchor="middle" fill="#fff" font-weight="600" font-size="13">B answers in 108</text>
<rect x="684.8" y="105" width="95.0" height="26" rx="3" fill="url(#hatchC)" stroke="#54A24B" stroke-width="1.5" stroke-dasharray="4 2"/>
<text x="732.3" y="122" text-anchor="middle" fill="#2d6a27" font-weight="600" font-size="12">C needs 25</text>
<rect x="779.8" y="105" width="80.0" height="26" rx="3" fill="url(#hatchW)" stroke="#8C8C8C" stroke-width="1.5" stroke-dasharray="4 2"/>
<text x="819.8" y="122" text-anchor="middle" fill="#444" font-weight="600" font-size="11">own work</text>
<text x="830.0" y="46" text-anchor="middle" fill="#D62728" font-weight="600">deadline</text>
<text x="824.0" y="93" text-anchor="end" fill="#D62728" font-size="12">If called, C at its minimum timeout of 25 ms → response at 201 ms, after the deadline</text>
<text x="824.0" y="153" text-anchor="end" fill="#222" font-size="12">So our service skips C and responds at 176 ms</text>
