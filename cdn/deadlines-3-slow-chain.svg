<svg xmlns="http://www.w3.org/2000/svg" width="880" height="230" viewBox="0 0 880 230" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13">
<defs><pattern id="hatchC" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#e3f0e1"/><line x1="0" y1="0" x2="0" y2="6" stroke="#54A24B" stroke-width="2"/></pattern><pattern id="hatchW" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#eee"/><line x1="0" y1="0" x2="0" y2="6" stroke="#8C8C8C" stroke-width="2"/></pattern></defs>
<rect width="880" height="230" rx="8" fill="#fff"/>
<text x="20" y="28" font-size="15" font-weight="600" fill="#222">Slow A and B: with C, the response would come after the deadline, so C is skipped</text>
<line x1="170.0" y1="190" x2="830.0" y2="190" stroke="#666"/>
<line x1="170.0" y1="62" x2="170.0" y2="190" stroke="#ddd" stroke-dasharray="2 3"/>
<text x="170.0" y="206" text-anchor="middle" fill="#666" font-size="11">0</text>
<line x1="236.0" y1="62" x2="236.0" y2="190" stroke="#ddd" stroke-dasharray="2 3"/>
<text x="236.0" y="206" text-anchor="middle" fill="#666" font-size="11">20</text>
<line x1="302.0" y1="62" x2="302.0" y2="190" stroke="#ddd" stroke-dasharray="2 3"/>
<text x="302.0" y="206" text-anchor="middle" fill="#666" font-size="11">40</text>
<line x1="368.0" y1="62" x2="368.0" y2="190" stroke="#ddd" stroke-dasharray="2 3"/>
<text x="368.0" y="206" text-anchor="middle" fill="#666" font-size="11">60</text>
<line x1="434.0" y1="62" x2="434.0" y2="190" stroke="#ddd" stroke-dasharray="2 3"/>
<text x="434.0" y="206" text-anchor="middle" fill="#666" font-size="11">80</text>
<line x1="500.0" y1="62" x2="500.0" y2="190" stroke="#ddd" stroke-dasharray="2 3"/>
<text x="500.0" y="206" text-anchor="middle" fill="#666" font-size="11">100</text>
<line x1="566.0" y1="62" x2="566.0" y2="190" stroke="#ddd" stroke-dasharray="2 3"/>
<text x="566.0" y="206" text-anchor="middle" fill="#666" font-size="11">120</text>
<line x1="632.0" y1="62" x2="632.0" y2="190" stroke="#ddd" stroke-dasharray="2 3"/>
<text x="632.0" y="206" text-anchor="middle" fill="#666" font-size="11">140</text>
<line x1="698.0" y1="62" x2="698.0" y2="190" stroke="#ddd" stroke-dasharray="2 3"/>
<text x="698.0" y="206" text-anchor="middle" fill="#666" font-size="11">160</text>
<line x1="764.0" y1="62" x2="764.0" y2="190" stroke="#ddd" stroke-dasharray="2 3"/>
<text x="764.0" y="206" text-anchor="middle" fill="#666" font-size="11">180</text>
